name: Log Analyzer CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  python-analyzer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Python analyzer image
        run: docker build -t log-analyzer ./python

      - name: Test JSON output
        shell: bash
        run: |
          printf 'INFO: Application started\nWARN: High memory usage\nERROR: Database connection failed\nINFO: Application recovered\n' > python/ci-sample.log

          set +e
          docker run --rm \
            -v "$PWD/python:/app" \
            log-analyzer ci-sample.log --json > output.json
          status=$?
          set -e

          if [ "$status" -ne 2 ]; then
            echo "Expected exit code 2 for logs containing errors; got $status"
            cat output.json
            exit 1
          fi

          jq -e '.INFO == 2 and .WARN == 1 and .ERROR == 1 and .total == 4' output.json
